###############################################################################
#
# Shower Guard
#
# Version : 1.5.0
#
# Purpose
# -------
# Surface the Shower Guard custom component's internal state as HA entities
# so they can be used in dashboards, automations, and notifications.
#
# The custom component owns all session detection and decision logic.
# This package only adds helpers and template sensors that mirror its state.
#
# v1.5 (ADR-0004): session start is no longer a flat number a template
# sensor can compare against (it's now the stateful ambient baseline owned
# by session.py). The "Session State"/"Session Active" sensors below read
# binary_sensor.shower_guard_session_active, which the integration itself
# publishes, instead of re-deriving session state from a hardcoded humidity
# threshold.
#
###############################################################################

###############################################################################
# Helpers
###############################################################################

input_boolean:

  shower_guard_pump_should_be_off:
    name: Shower Guard — Pump Should Be Off
    icon: mdi:water-off

###############################################################################
# Template sensors
# These mirror the component's internal state as proper HA entities.
###############################################################################

template:

  - sensor:

      - name: Shower Guard Session State
        unique_id: shower_guard_session_state
        icon: mdi:shower
        state: >
          {{ states('binary_sensor.shower_guard_session_active') }}
        # Note: this mirrors the integration's own published entity — see
        # the binary_sensor below, which is the actual source of truth as
        # of v1.5 (ADR-0004). Kept for backward-compatible entity naming.

      - name: Shower Guard Humidity
        unique_id: shower_guard_humidity
        unit_of_measurement: "%"
        state_class: measurement
        device_class: humidity
        icon: mdi:water-percent
        state: >
              {{ states('sensor.bathroom_third_reality_inc_3rths0224z_humidity') | float(0) | round(1) }}

      - name: Shower Guard Presence
        unique_id: shower_guard_presence
        icon: mdi:motion-sensor
        state: >
          {% if states('binary_sensor.bathroom_movement_detector_bathroom') == 'on' %}
            detected
          {% elif states('binary_sensor.bathroom_movement_detector_bathroom') == 'off' %}
            clear
          {% else %}
            unknown
          {% endif %}

      - name: Shower Guard Pump State
        unique_id: shower_guard_pump_state
        icon: mdi:water-pump
        state: >
          {% if is_state('input_boolean.shower_guard_pump_should_be_off', 'on') %}
            off
          {% else %}
            on
          {% endif %}

  - binary_sensor:

      # Note: "Shower Guard Session Active" (binary_sensor.shower_guard_
      # session_active) is intentionally NOT defined here. As of v1.5
      # (ADR-0004), session start/active is a stateful, dynamic-baseline
      # computation owned by session.py — there's no flat number a template
      # sensor can compare against anymore. The integration itself publishes
      # this entity directly (see __init__.py's _publish_decision_state /
      # ENTITY_ID_SESSION_ACTIVE in const.py). Re-adding a hardcoded
      # threshold comparison here would silently drift from the real session
      # state, exactly the architectural-debt failure mode this project
      # tries to avoid (see ADR-0001's layer-separation principle).

      - name: Shower Guard Presence Detected
        unique_id: shower_guard_presence_detected
        device_class: motion
        state: >
          {{ states('binary_sensor.bathroom_movement_detector_bathroom') == 'on' }}

      - name: Shower Guard Water Available
        unique_id: shower_guard_water_available
        device_class: running
        icon: mdi:water
        state: >
          {{ is_state('input_boolean.shower_guard_pump_should_be_off', 'off') }}

###############################################################################
# Scripts — actuator abstraction (ADR-0001)
# The component calls these; they own the actual device control.
# Edit the actions below to match your deployment target.
###############################################################################

script:

  shower_guard_cut_water:
    alias: Shower Guard — Cut Water
    icon: mdi:water-off
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shower_guard_pump_should_be_off
      # Notifications are sent by the Shower Guard integration via notify_service,
      # not by the actuator script itself.

  shower_guard_restore_water:
    alias: Shower Guard — Restore Water
    icon: mdi:water
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shower_guard_pump_should_be_off
      # No persistent_notification is created by the current integration.
